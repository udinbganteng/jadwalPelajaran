        // INITIALIZATION
        window.onload = function() {
            // Set default selected day based on real day
            const now = new Date();
            let day = now.getDay(); // 0 is Sunday, 1 is Monday...
            selectedDayIndex = day === 0 ? 6 : day - 1;

            updateRealtimeClock();
            setInterval(updateRealtimeClock, 1000);

            renderDaysPill();
            renderSchedule();
            updateNotesBadge();
        };

        function updateRealtimeClock() {
            const now = new Date();
            
            // Format time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds} WIB`;

            // Format date string
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date-str').innerText = now.toLocaleDateString('id-ID', options);

            // Re-render schedule every minute to refresh active status highlight
            if (seconds === '00') {
                renderSchedule();
            }
        }

        // SET MINGGU UMUM / PRODUKTIF
        function setWeekType(type) {
            currentWeekType = type;
            const btnUmum = document.getElementById('btn-week-umum');
            const btnProd = document.getElementById('btn-week-produktif');

            if (type === 'umum') {
                btnUmum.className = "w-1/2 py-2 text-xs font-bold rounded-xl transition-all duration-300 z-10 text-white bg-sage-600 shadow-md";
                btnProd.className = "w-1/2 py-2 text-xs font-bold rounded-xl transition-all duration-300 z-10 text-gray-600";
            } else {
                btnProd.className = "w-1/2 py-2 text-xs font-bold rounded-xl transition-all duration-300 z-10 text-white bg-amber-500 shadow-md";
                btnUmum.className = "w-1/2 py-2 text-xs font-bold rounded-xl transition-all duration-300 z-10 text-gray-600";
            }

            renderSchedule();
        }

        // RELATIVE DAY NAVIGATION (Kemarin, Hari ini, Besok)
        function navigateRelativeDay(offset) {
            const now = new Date();
            let todayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1;
            let targetIdx = todayIdx + offset;

            if (targetIdx < 0) targetIdx = 6;
            if (targetIdx > 6) targetIdx = 0;

            selectedDayIndex = targetIdx;
            
            // Update UI buttons
            const btnYesterday = document.getElementById('btn-rel-kemarin');
            const btnToday = document.getElementById('btn-rel-today');
            const btnTomorrow = document.getElementById('btn-rel-besok');

            [btnYesterday, btnToday, btnTomorrow].forEach(b => {
                b.className = "flex-1 py-1.5 text-xs font-semibold text-gray-500 hover:text-sage-700 rounded-xl transition-all text-center";
            });

            if (offset === -1) btnYesterday.className = "flex-1 py-1.5 text-xs font-bold text-white bg-amber-500 rounded-xl shadow-md transition-all text-center";
            if (offset === 0) btnToday.className = "flex-1 py-1.5 text-xs font-bold text-white bg-amber-500 rounded-xl shadow-md transition-all text-center";
            if (offset === 1) btnTomorrow.className = "flex-1 py-1.5 text-xs font-bold text-white bg-amber-500 rounded-xl shadow-md transition-all text-center";

            renderDaysPill();
            renderSchedule();
        }

        // RENDER DAYS PILL SELECTOR
        function renderDaysPill() {
            const container = document.getElementById('days-pill-container');
            container.innerHTML = '';

            const now = new Date();
            const realTodayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1;

            dayNames.forEach((name, idx) => {
                const isSelected = idx === selectedDayIndex;
                const isRealToday = idx === realTodayIdx;

                const pill = document.createElement('button');
                pill.onclick = () => {
                    selectedDayIndex = idx;
                    renderDaysPill();
                    renderSchedule();
                };

                let activeClasses = isSelected 
                    ? 'bg-sage-600 text-white shadow-neu-sm scale-105 font-bold' 
                    : 'bg-white/70 text-gray-600 hover:bg-white font-medium';
                
                let todayIndicator = isRealToday ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-amber-400' : 'bg-sage-600'}"></span>` : '';

                pill.className = `flex-shrink-0 flex flex-col items-center justify-center w-12 py-2.5 rounded-2xl transition-all duration-200 ${activeClasses}`;
                pill.innerHTML = `
                    <span class="text-[10px] uppercase opacity-80">${dayShorts[idx]}</span>
                    <span class="text-sm my-0.5">${name.substring(0, 3)}</span>
                    ${todayIndicator}
                `;
                container.appendChild(pill);
            });
        }

        // RENDER SCHEDULE OR NOTES
        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            if (activeTab === 'notes') {
                renderNotesView(container);
                return;
            }

            const currentDaySchedule = scheduleData[currentWeekType][selectedDayIndex] || [];

            if (currentDaySchedule.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-center p-6">
                        <div class="w-20 h-20 bg-sage-100 text-sage-600 rounded-full flex items-center justify-center mb-3 text-3xl shadow-neu-inner">
                            <i class="fa-solid fa-mug-hot"></i>
                        </div>
                        <h3 class="font-bold text-gray-700 text-base">Tidak Ada Jadwal Pelajaran</h3>
                        <p class="text-xs text-gray-500 mt-1">Hari ${dayNames[selectedDayIndex]} adalah hari libur sekolah.</p>
                    </div>
                `;
                return;
            }

            const now = new Date();
            const currentRealDay = now.getDay() === 0 ? 6 : now.getDay() - 1;
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTimeStr = `${String(currentHours).padStart(2, '0')}:${String(currentMinutes).padStart(2, '0')}`;

            currentDaySchedule.forEach((item, index) => {
                const isBreak = item.isBreak;
                let status = 'upcoming'; // 'done', 'active', 'upcoming'
                
                if (selectedDayIndex < currentRealDay) {
                    status = 'done';
                } else if (selectedDayIndex > currentRealDay) {
                    status = 'upcoming';
                } else {
                    if (currentTimeStr > item.end) {
                        status = 'done';
                    } else if (currentTimeStr >= item.start && currentTimeStr <= item.end) {
                        status = 'active';
                    } else {
                        status = 'upcoming';
                    }
                }

                const card = document.createElement('div');
                
                // Active status custom style based on reference UI (Green Solid Card)
                if (status === 'active') {
                    card.className = "mb-4 p-4 rounded-2xl bg-sage-600 text-white shadow-xl transform scale-[1.02] border border-sage-500 transition-all relative overflow-hidden";
                    card.innerHTML = `
                        <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-lg text-white">
                                    <i class="fa-solid ${item.icon || 'fa-book-open'}"></i>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="bg-amber-500 text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider shadow">Sedang Berlangsung</span>
                                    </div>
                                    <h2 class="font-bold text-base mt-0.5 leading-snug">${item.name}</h2>
                                </div>
                            </div>
                            <button onclick="openNoteModalFor('${item.name}')" class="text-white/80 hover:text-white p-1">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                        </div>
                        <div class="mt-3 pt-3 border-t border-white/20 flex items-center justify-between text-xs text-sage-100 font-medium">
                            <div class="flex items-center space-x-1.5">
                                <i class="fa-regular fa-clock"></i>
                                <span>${item.start} - ${item.end} WIB</span>
                            </div>
                            ${!isBreak ? `
                            <div class="flex items-center space-x-2">
                                <span><i class="fa-regular fa-user mr-1"></i>${item.teacher}</span>
                                <span class="bg-white/20 px-2 py-0.5 rounded-md text-[10px] font-bold">${item.room}</span>
                            </div>` : ''}
                        </div>
                    `;
                } else {
                    // Normal / Inactive / Break card
                    const opacityClass = status === 'done' ? 'opacity-60 bg-white/60' : 'bg-white/90';
                    card.className = `mb-3 p-4 rounded-2xl shadow-neu-sm ${opacityClass} border border-white transition-all`;
                    
                    card.innerHTML = `
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-xl ${isBreak ? 'bg-amber-100 text-amber-600' : 'bg-sage-100 text-sage-600'} flex items-center justify-center text-sm font-bold">
                                    <i class="fa-solid ${item.icon || 'fa-book'}"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                                    <div class="flex items-center space-x-2 text-xs text-gray-500 mt-0.5">
                                        <span><i class="fa-regular fa-clock mr-1"></i>${item.start} - ${item.end}</span>
                                        ${status === 'done' ? '<span class="text-[10px] bg-gray-200 text-gray-600 font-bold px-1.5 py-0.2 rounded">Selesai</span>' : ''}
                                    </div>
                                </div>
                            </div>
                            ${!isBreak ? `
                            <button onclick="openNoteModalFor('${item.name}')" class="text-gray-400 hover:text-sage-600 p-1 text-sm">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>` : ''}
                        </div>
                        ${!isBreak ? `
                        <div class="mt-2.5 pt-2 border-t border-gray-100 flex items-center justify-between text-xs text-gray-600">
                            <span class="truncate max-w-[200px]"><i class="fa-regular fa-user mr-1 text-sage-600"></i>${item.teacher}</span>
                            <span class="font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md text-[10px]">${item.room}</span>
                        </div>` : ''}
                    `;
                }

                container.appendChild(card);
            });
        }

        // TAB SWITCHING (HOME / NOTES)
        function switchTab(tab) {
            activeTab = tab;
            const navHome = document.getElementById('nav-home');
            const navNotes = document.getElementById('nav-notes');

            if (tab === 'home') {
                navHome.className = "p-3 text-sage-600 rounded-2xl transition-all";
                navNotes.className = "p-3 text-gray-400 hover:text-sage-600 rounded-2xl transition-all relative";
            } else {
                navNotes.className = "p-3 text-sage-600 rounded-2xl transition-all relative";
                navHome.className = "p-3 text-gray-400 hover:text-sage-600 rounded-2xl transition-all";
            }
            renderSchedule();
        }

        // RENDER NOTES / TASKS LIST
        function renderNotesView(container) {
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-center p-6">
                        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-3 text-2xl">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <h3 class="font-bold text-gray-700 text-base">Belum Ada Tugas / Catatan</h3>
                        <p class="text-xs text-gray-500 mt-1">Klik tombol (+) di bawah untuk menambah tugas baru.</p>
                    </div>
                `;
                return;
            }

            const header = document.createElement('div');
            header.className = "flex justify-between items-center mb-3";
            header.innerHTML = `<h3 class="font-bold text-gray-700 text-sm">Daftar Tugas (${tasks.length})</h3>`;
            container.appendChild(header);

            tasks.forEach((task, idx) => {
                const card = document.createElement('div');
                card.className = "mb-3 p-4 rounded-2xl bg-white/90 shadow-neu-sm border border-white flex justify-between items-start";
                card.innerHTML = `
                    <div class="flex-1 pr-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-sage-100 text-sage-700 font-bold text-[10px] px-2 py-0.5 rounded-md">${dayNames[task.day]}</span>
                            <span class="text-xs font-medium text-gray-500"><i class="fa-regular fa-clock mr-1"></i>${task.time}</span>
                        </div>
                        <h4 class="font-bold text-gray-800 text-sm mt-1">${task.title}</h4>
                        ${task.desc ? `<p class="text-xs text-gray-600 mt-1 bg-gray-50 p-2 rounded-lg border border-gray-100">${task.desc}</p>` : ''}
                    </div>
                    <button onclick="deleteTask(${idx})" class="text-red-400 hover:text-red-600 p-1">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // MODAL FUNCTIONS
        function openModal() {
            document.getElementById('task-modal').classList.remove('hidden');
            document.getElementById('task-day').value = selectedDayIndex;
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
            document.getElementById('task-form').reset();
        }

        function openNoteModalFor(title) {
            openModal();
            document.getElementById('task-title').value = `Tugas ${title}`;
        }

        function saveTask(event) {
            event.preventDefault();
            const title = document.getElementById('task-title').value;
            const day = parseInt(document.getElementById('task-day').value);
            const time = document.getElementById('task-time').value;
            const desc = document.getElementById('task-desc').value;

            tasks.push({ title, day, time, desc });
            localStorage.setItem('rpl2_tasks', JSON.stringify(tasks));

            closeModal();
            updateNotesBadge();
            if (activeTab === 'notes') renderSchedule();
        }

        function deleteTask(idx) {
            tasks.splice(idx, 1);
            localStorage.setItem('rpl2_tasks', JSON.stringify(tasks));
            updateNotesBadge();
            renderSchedule();
        }

        function updateNotesBadge() {
            const badge = document.getElementById('notes-badge');
            if (tasks.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
